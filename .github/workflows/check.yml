name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: tgviewer_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check app tests scripts manage.py doctor.py
      - run: python -m ruff format --check app tests scripts manage.py doctor.py
      - run: python -m pytest -q
        env:
          TGVIEWER_TEST_DATABASE_URL: postgresql+asyncpg://postgres:test-only-password@127.0.0.1:5432/tgviewer_test
      - run: python -m pip_audit -r requirements.txt --disable-pip --no-deps
