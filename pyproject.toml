[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-channel-viewer"
version = "2.0.4"
description = "Controlled public Telegram channel viewer for consented user accounts"
requires-python = ">=3.12"
dependencies = [
  "aiogram==3.30.0", "Telethon==1.44.0", "SQLAlchemy==2.0.51",
  "asyncpg==0.32.0", "pydantic-settings==2.16.0", "cryptography==50.0.2",
  "openpyxl==3.1.5", "httpx[socks]==0.28.1", "PySocks==1.7.1",
  "python-socks[asyncio]==2.8.2", "qrcode[pil]==8.2", "tzdata>=2026.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.17.1", "aiosqlite==0.22.1", "pip-audit==2.10.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
